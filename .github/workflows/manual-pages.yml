name: Publish operation guide

on:
  push:
    branches: [main]
    paths:
      - manual.html
      - manual.en.html
      - .github/workflows/manual-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare guide
        run: |
          mkdir -p _site
          cp manual.html _site/manual.html
          cp manual.en.html _site/manual.en.html
          cp manual.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
